<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MadadPass API documentation</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/docs.js"></script>
</head>
<body class="docs-body">
  <main class="stack" id="main">
    <header class="page-head"><div><p class="eyebrow">DEVELOPER DOCUMENTATION</p><h1>MadadPass API</h1>
      <p class="lead">Explore the local endpoints using fictional data.</p></div><a class="button secondary" href="/">Back to MadadPass</a></header>
    <section class="panel stack" aria-label="API authentication">
      <h2>Authentication</h2>
      <p>Send credentials to <code>POST /api/login</code> for a JWT. Admins can create scoped keys for the three mock services.</p>
      <div class="form-grid"><label>Bearer token<input id="bearer" type="password" autocomplete="off"></label>
      <label>Mock API key<input id="key" type="password" autocomplete="off"></label></div>
      <div><a href="/openapi.json">Download OpenAPI JSON</a></div>
    </section>
    <section class="panel stack" id="operations" aria-label="API endpoints"><p>Loading endpoints…</p></section>
  </main>
</body>
</html>
